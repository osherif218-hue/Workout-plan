<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Workout Log</title>
<meta name="theme-color" content="#111827">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Workout">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<style>
:root{--bg:#f3f4f6;--card:#fff;--ink:#111827;--mut:#6b7280;--line:#e5e7eb;--cy:#00c8d8;--red:#e11d2e;--inp:#f9fafb;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b0f17;--card:#161c28;--ink:#f3f4f6;--mut:#9ca3af;--line:#262e3d;--inp:#0f141d}}
:root[data-theme="dark"]{--bg:#0b0f17;--card:#161c28;--ink:#f3f4f6;--mut:#9ca3af;--line:#262e3d;--inp:#0f141d}
*{box-sizing:inherit}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.4 -apple-system,"Segoe UI",Roboto,Arial,sans-serif;min-height:100vh}
.top{background:#111827;color:#fff;padding:14px 16px;display:flex;align-items:center;gap:12px;position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.top img{width:42px;height:42px;border-radius:12px;background:#fff}
.top h1{font-size:19px;margin:0;flex:1}.top small{color:#9ca3af;display:block;font-weight:400;font-size:12px}
.back{background:none;border:0;color:var(--cy);font-size:15px;font-weight:700;padding:6px}
main{max-width:640px;margin:0 auto;padding:14px 14px 80px}
.btn{width:100%;border:0;border-radius:14px;padding:14px;font-size:16px;font-weight:700;background:var(--cy);color:#06222a}
.week{display:flex;align-items:center;justify-content:space-between;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin-top:10px;cursor:pointer}
.week b{font-size:18px}.week span{color:var(--mut);font-size:13px;display:block}
.dots{display:flex;gap:6px}.dot{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);font-size:12px;font-weight:700;display:grid;place-items:center;color:var(--mut)}
.dot.on{background:var(--cy);border-color:var(--cy);color:#06222a}
.tabs{display:flex;gap:8px;margin:4px 0 12px}
.tab{flex:1;padding:11px 4px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-weight:700;font-size:14px}
.tab.sel{background:#111827;color:#fff;border-color:#111827}
.datebar{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin-bottom:10px}
.datebar label{font-weight:700;font-size:14px}.datebar input{flex:1;min-width:0}
input{font:inherit;color:var(--ink);background:var(--inp);border:1px solid var(--line);border-radius:10px;padding:10px;width:100%}
.ex{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;margin-bottom:10px}
.ex h3{margin:0 0 6px;font-size:16px}.ex h3 i{color:var(--mut);font-style:normal;font-weight:400;margin-right:6px}
.chips{display:flex;gap:6px;margin-bottom:8px}.chip{font-size:12px;font-weight:700;padding:3px 9px;border-radius:99px;background:var(--line);color:var(--ink)}
.chip.r{background:var(--red);color:#fff}
.g{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}.g label{font-size:11px;color:var(--mut);font-weight:700;display:block;margin-bottom:2px}
.n{margin-top:8px}
.rest{background:#111827;color:#fff;border-radius:12px;padding:10px 14px;display:flex;justify-content:space-between;font-weight:700;font-size:13px}.rest b{color:var(--cy)}
.del{background:none;border:0;color:var(--red);font-weight:700;margin-top:18px;width:100%;padding:10px}
.sv{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));background:#111827;color:#fff;border-radius:99px;padding:6px 14px;font-size:12px;opacity:0;transition:.3s}
.sv.show{opacity:.95}
.ins{background:var(--card);border-bottom:1px solid var(--line);padding:10px 14px;display:flex;align-items:center;gap:10px;font-size:14px}.ins span{flex:1}.ins button{border:0;border-radius:10px;padding:9px 14px;font-weight:700;font-size:14px;background:var(--cy);color:#06222a}.ins .x{background:none;color:var(--mut);padding:6px 8px}
.hero{display:flex;align-items:flex-end;gap:14px;border-bottom:3px solid var(--cy);margin:0 0 14px;padding:0 4px}.hero img{height:150px;width:auto;display:block;margin-bottom:-1px}.hero div{padding-bottom:12px}.hero em{font-style:normal;background:var(--cy);color:#06222a;font-weight:800;font-size:11px;border-radius:99px;padding:2px 9px}.hero h2{margin:6px 0 0;font-size:26px;line-height:1.1}.hero p{margin:4px 0 0;color:var(--mut);font-size:13px}
.empty{text-align:center;color:var(--mut);margin:30px 0}
</style></head><body>
<div class="top"><img src="icon-192.png" alt=""><h1 id="t">Workout Log<small id="sub">Full body split</small></h1><button class="back" id="back" hidden>&#8249; Weeks</button></div>
<div id="ins" hidden></div><main id="app"></main><div class="sv" id="sv">Saved</div>
<script>
var PLAN={
A:{n:"Full Body A",rest:"1 rest day",ex:[["DB lateral raises",2,2],["DB Flat Chest Press",3,1],["T-Bar Row",2,1],["Cable Rear Delt fly",1,1],["WG lat pulldown",1,1],["SA Triceps Pushdown",1,1],["Face Away curl",3,1],["Leg Press",2,1],["Seated leg curl",1,1],["Leg extension",1,1],["Shoulder Press",1,1]]},
B:{n:"Full Body B",rest:"2 rest days",ex:[["SA Cable lateral raises",2,1],["T-Bar Row",2,1],["Cable Rear Delt fly",1,1],["Inclined chest press machine",2,1],["NG Lat row",1,1],["Overhead Triceps extension",2,2],["Face away curl",2,1],["Wide chest press machine",2,1],["WG lat pulldown",2,1],["Leg Extension",2,1],["Seated leg curl",1,2],["Leg press calf raises",2,2],["Smith shrugs",1,1]]},
C:{n:"Full Body C",rest:"1 rest day",ex:[["SA Cable lateral raises",2,1],["DB Flat Chest Press",3,1],["T-Bar Row",2,1],["DB biceps curl",1,2],["NG Lat row",1,1],["SA Triceps Pushdown",1,1],["Leg press calf raises",1,1],["Leg extension",2,1],["Seated leg curl",2,1],["reverse curl",0,1],["wrist curl",0,1]]}};
var OFF={A:0,B:2,C:5},KEYS=["A","B","C"],LS="wl_state_v1";
var S={weeks:[],t:0},view=null,tab="A",dbDoc=null,timer=null;
var app=document.getElementById("app");
function $(i){return document.getElementById(i)}
function pad(n){return(n<10?"0":"")+n}
function iso(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())}
function addDays(s,n){var p=s.split("-"),d=new Date(+p[0],+p[1]-1,+p[2]+n);return iso(d)}
function fmt(s){if(!s)return"";var p=s.split("-");return(+p[2])+"/"+(+p[1])}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function flash(m){var e=$("sv");e.textContent=m;e.className="sv show";clearTimeout(flash.t);flash.t=setTimeout(function(){e.className="sv"},1200)}
function load(){try{var r=localStorage.getItem(LS);if(r){var o=JSON.parse(r);if(o&&o.weeks)S=o}}catch(e){}}
function save(){S.t=Date.now();try{localStorage.setItem(LS,JSON.stringify(S));flash("Saved")}catch(e){flash("Could not save")}}
function wk(id){for(var i=0;i<S.weeks.length;i++)if(S.weeks[i].id===id)return S.weeks[i]}
function sorted(){return S.weeks.slice().sort(function(a,b){return a.start<b.start?1:-1})}
function filled(w,k){var d=w.days[k];if(!d)return false;for(var i in d.ex){var e=d.ex[i];if(e&&(e.a||e.w||e.b))return true}return false}
function home(){view=null;$("back").hidden=true;$("sub").textContent="Full body split";
 var h='<button class="btn" id="new">+ New week</button>';var ws=sorted();
 if(!ws.length)h+='<p class="empty">No weeks yet. Tap "New week" and pick the date you start Full Body A.</p>';
 ws.forEach(function(w){h+='<div class="week" data-id="'+w.id+'"><div><b>Week of '+fmt(w.start)+'</b><span>'+KEYS.map(function(k){return fmt(w.days[k].date)}).join(" · ")+'</span></div><div class="dots">'+KEYS.map(function(k){return'<div class="dot'+(filled(w,k)?" on":"")+'">'+k+'</div>'}).join("")+'</div></div>'});
 h+='<div style="display:flex;gap:8px;margin-top:22px"><button class="tab" id="exp">Export backup</button><button class="tab" id="imp">Import backup</button></div><input type="file" id="imf" accept=".json,application/json" hidden>';
 app.innerHTML=h;
 $("exp").onclick=function(){var b=new Blob([JSON.stringify(S)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="workout-backup-"+iso(new Date())+".json";document.body.appendChild(a);a.click();a.remove()};
 $("imp").onclick=function(){$("imf").click()};
 $("imf").onchange=function(){var f=this.files[0];if(!f)return;var r=new FileReader();r.onload=function(){try{var o=JSON.parse(r.result);if(o&&o.weeks){S=o;save();home()}else flash("Invalid file")}catch(e){flash("Invalid file")}};r.readAsText(f)};
 $("new").onclick=function(){var d=prompt("Start date of Full Body A (YYYY-MM-DD)",iso(new Date()));if(!d||!/^\d{4}-\d{1,2}-\d{1,2}$/.test(d.trim()))return;var p=d.trim().split("-");d=p[0]+"-"+pad(+p[1])+"-"+pad(+p[2]);
  var w={id:"w"+Date.now(),start:d,days:{}};KEYS.forEach(function(k){w.days[k]={date:addDays(d,OFF[k]),ex:{}}});S.weeks.push(w);save();open(w.id)};
 Array.prototype.forEach.call(app.querySelectorAll(".week"),function(e){e.onclick=function(){open(e.getAttribute("data-id"))}})}
function prev(w,k,i){var best=null;S.weeks.forEach(function(o){if(o.id!==w.id&&o.start<w.start&&o.days[k]&&o.days[k].ex[i]&&o.days[k].ex[i].w&&(!best||o.start>best.start))best=o});return best?best.days[k].ex[i].w:""}
function open(id){view=id;$("back").hidden=false;var w=wk(id);$("sub").textContent="Week of "+fmt(w.start);draw()}
function draw(){var w=wk(view),d=w.days[tab],P=PLAN[tab];
 var n=KEYS.filter(function(k){return filled(w,k)}).length;var h='<div class="hero"><img src="figure.png" alt=""><div><em>WEEK</em><h2>'+fmt(w.start)+'</h2><p>'+n+' of 3 days logged</p></div></div><div class="tabs">'+KEYS.map(function(k){return'<button class="tab'+(k===tab?" sel":"")+'" data-k="'+k+'">'+PLAN[k].n.replace("Full Body ","Day ")+'<br><small>'+fmt(w.days[k].date)+'</small></button>'}).join("")+'</div>';
 h+='<div class="datebar"><label>'+P.n+' date</label><input type="date" id="dt" value="'+d.date+'"></div>';
 P.ex.forEach(function(x,i){var e=d.ex[i]||{},pw=prev(w,tab,i);
  h+='<div class="ex"><h3><i>'+(i+1)+'</i>'+esc(x[0])+'</h3><div class="chips"><span class="chip">Warm-up '+x[1]+'</span><span class="chip r">Working '+x[2]+'</span></div><div class="g">'
  +'<div><label>First set</label><input data-i="'+i+'" data-f="a" inputmode="decimal" value="'+esc(e.a)+'"></div>'
  +'<div><label>Weight (kg)</label><input data-i="'+i+'" data-f="w" inputmode="decimal" placeholder="'+(pw?"last "+esc(pw):"")+'" value="'+esc(e.w)+'"></div>'
  +'<div><label>Second set</label><input data-i="'+i+'" data-f="b" inputmode="decimal" value="'+esc(e.b)+'"></div></div>'
  +'<div class="n"><input data-i="'+i+'" data-f="n" placeholder="Notes" value="'+esc(e.n)+'"></div></div>'});
 h+='<div class="rest"><span>THEN: '+P.rest.toUpperCase()+'</span><b>REST &amp; RECOVER</b></div><button class="del" id="del">Delete this week</button>';
 app.innerHTML=h;window.scrollTo(0,0);
 Array.prototype.forEach.call(app.querySelectorAll(".tab"),function(b){b.onclick=function(){tab=b.getAttribute("data-k");draw()}});
 $("dt").onchange=function(){d.date=this.value;save();draw()};
 Array.prototype.forEach.call(app.querySelectorAll(".ex input"),function(inp){inp.oninput=function(){var i=inp.getAttribute("data-i");d.ex[i]=d.ex[i]||{};d.ex[i][inp.getAttribute("data-f")]=inp.value;save()}});
 $("del").onclick=function(){if(confirm("Delete the week of "+fmt(w.start)+"?")){S.weeks=S.weeks.filter(function(o){return o.id!==w.id});save();home()}}}
$("back").onclick=home;
load();home();
(function(){var box=$("ins"),dp=null;
 function standalone(){return window.matchMedia("(display-mode: standalone)").matches||navigator.standalone===true}
 function hide(){box.hidden=true;try{localStorage.setItem("wl_ins_off","1")}catch(e){}}
 function off(){try{return localStorage.getItem("wl_ins_off")==="1"}catch(e){return false}}
 if(standalone()||off())return;
 window.addEventListener("beforeinstallprompt",function(e){e.preventDefault();dp=e;
  box.innerHTML='<span>Install this app on your home screen</span><button id="ib">Install app</button><button class="x" id="ix">&#10005;</button>';box.hidden=false;
  $("ib").onclick=function(){dp.prompt();dp.userChoice.then(function(){box.hidden=true;dp=null})};$("ix").onclick=hide});
 window.addEventListener("appinstalled",function(){box.hidden=true});
 var ios=/iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1);
 if(ios){box.innerHTML='<span>To install: tap the <b>Share</b> button, then <b>Add to Home Screen</b>.</span><button class="x" id="ix">Got it</button>';box.hidden=false;$("ix").onclick=hide}
})();
if("serviceWorker" in navigator)window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){})});
</script></body></html>
