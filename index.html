<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Workout Admin</title><link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#111111"><link rel="apple-touch-icon" href="../icon-192.png">
<style>:root{--b:#fff;--c:#f1f1f4;--t:#111;--a:#e5322d}@media(prefers-color-scheme:dark){:root{--b:#111;--c:#1f1f24;--t:#eee}}
*{box-sizing:border-box}body{margin:0 auto;max-width:760px;padding:12px;background:var(--b);color:var(--t);font:15px system-ui,sans-serif}
h2{margin:6px 0}.r{display:flex;gap:6px;align-items:center;margin:6px 0;flex-wrap:wrap}.card{background:var(--c);border-radius:12px;padding:10px;margin:8px 0}
input,select,button{font:inherit;padding:8px;border-radius:8px;border:1px solid #8884;background:var(--b);color:var(--t);min-width:0}input[type=number]{width:62px}.g{flex:1}
button{cursor:pointer}.p{background:var(--a);color:#fff;border:0}.on{background:var(--t);color:var(--b)}
.tabs{display:flex;gap:6px;position:sticky;top:0;background:var(--b);padding:6px 0;z-index:5}.tabs button{flex:1}
#m{font-size:13px;opacity:.8;min-height:18px}img.t{height:56px}small{opacity:.7}</style></head><body>
<div class="r"><h2 class="g">لوحة تحكم التمارين</h2><button class="p" id="sv">حفظ ونشر</button></div><div id="m"></div><div class="tabs" id="tb"></div><div id="v"></div>
<script>
var $=function(i){return document.getElementById(i)},L=localStorage,cfg=JSON.parse(L.adm||"{}"),D=null,F={},tab="ex",day="A",cc="",pv=null,TABS=[["ex","التمارين"],["im","الصور"],["ch","الشخصيات"],["st","الإعدادات"]];
function toast(t){$("m").textContent=t}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function gh(p,o){var u="https://api.github.com/repos/"+cfg.repo+"/contents/"+p+(o?"":"?ref="+cfg.br);return fetch(u,Object.assign({headers:{Authorization:"Bearer "+cfg.tok,Accept:"application/vnd.github+json"}},o||{}))}
function getF(p){return gh(p).then(function(r){if(r.status==404)return null;if(!r.ok)throw new Error(r.status==401?"الـ Token غلط":"خطأ "+r.status);return r.json().then(function(j){return{sha:j.sha,text:decodeURIComponent(escape(atob(j.content.replace(/\n/g,""))))}})})}
function putF(p,b64,m){return getF(p).then(function(f){var b={message:m,content:b64,branch:cfg.br};if(f)b.sha=f.sha;return gh(p,{method:"PUT",body:JSON.stringify(b)}).then(function(r){if(!r.ok)throw new Error("فشل رفع "+p)})})}
function enc(s){return btoa(unescape(encodeURIComponent(s)))}
function slug(s){return s.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"")||"x"}
function names(){var o={};["A","B","C"].forEach(function(k){D.plan[k].ex.forEach(function(x){o[x[0]]=1})});return Object.keys(o)}
function ld(f){return new Promise(function(ok,no){var i=new Image();i.onload=function(){ok(i)};i.onerror=no;i.src=URL.createObjectURL(f)})}
function cv(w,h){var c=document.createElement("canvas");c.width=w;c.height=h;return c}
function trim(img,s){var c=cv(Math.round(img.width*s),Math.round(img.height*s)),x=c.getContext("2d");x.drawImage(img,0,0,c.width,c.height);var d=x.getImageData(0,0,c.width,c.height).data,W=c.width,H=c.height,x0=W,x1=0,y0=H,y1=0,y,i;
 for(y=0;y<H;y++)for(i=0;i<W;i++)if(d[(y*W+i)*4+3]>10){if(i<x0)x0=i;if(i>x1)x1=i;if(y<y0)y0=y;if(y>y1)y1=y}
 var h=y1-y0+1,f0=W,f1=0;for(y=y1-Math.floor(h*.1);y<=y1;y++)for(i=0;i<W;i++)if(d[(y*W+i)*4+3]>10){if(i<f0)f0=i;if(i>f1)f1=i}
 return{c:c,x0:x0,y0:y0,w:x1-x0+1,h:h,fx:(f0+f1)/2-x0}}
function pair(a,b){var l=Math.max(a.fx,b.fx),W=Math.ceil(l+Math.max(a.w-a.fx,b.w-b.fx)),H=Math.max(a.h,b.h),k=480/H;return[a,b].map(function(t){var c=cv(Math.round(W*k),480),x=c.getContext("2d");x.imageSmoothingQuality="high";x.drawImage(t.c,t.x0,t.y0,t.w,t.h,(l-t.fx)*k,(H-t.h)*k,t.w*k,t.h*k);return c})}
function stage(name,c){F[name]=c.toDataURL("image/png").split(",")[1]}
function nav(){$("tb").innerHTML=TABS.map(function(t){return'<button class="'+(t[0]==tab?"on":"")+'" onclick="tab=\''+t[0]+'\';draw()">'+t[1]+'</button>'}).join("")}
function draw(){nav();clearInterval(pv);var v=$("v");if(tab=="st"||!D){stt();return}({ex:ex,im:im,ch:chr})[tab](v)}
function stt(){$("v").innerHTML='<div class="card"><div class="r"><b>ربط GitHub</b></div><div class="r"><input class="g" id="rp" placeholder="user/repo" value="'+esc(cfg.repo||"osherif218-hue/Workout-plan")+'"><input id="br" style="width:90px" value="'+esc(cfg.br||"main")+'"></div><div class="r"><input class="g" id="tk" type="password" placeholder="GitHub Token" value="'+esc(cfg.tok||"")+'"></div><small>الـ Token من GitHub &gt; Settings &gt; Developer settings &gt; Fine-grained tokens، على الـ repo بس، وصلاحية Contents: Read and write. بيتحفظ في جهازك بس.</small><div class="r"><button class="p" onclick="conn()">حفظ واتصال</button></div></div>'}
function conn(){cfg={repo:$("rp").value.trim(),br:$("br").value.trim()||"main",tok:$("tk").value.trim()};L.adm=JSON.stringify(cfg);boot()}
function boot(){if(!cfg.tok){tab="st";draw();return}toast("جاري التحميل...");getF("data.json").then(function(f){if(!f)throw new Error("data.json مش موجود في الـ repo، ارفعه الأول");D=JSON.parse(f.text);D.democ=D.democ||{};toast("تم الاتصال");tab="ex";draw()}).catch(function(e){toast(e.message);tab="st";draw()})}
function ex(v){var P=D.plan[day],h='<div class="r">'+["A","B","C"].map(function(k){return'<button class="'+(k==day?"on":"")+' g" onclick="day=\''+k+'\';draw()">'+k+'</button>'}).join("")+'</div><div class="card"><div class="r"><input class="g" value="'+esc(P.n)+'" onchange="D.plan[day].n=this.value"><input class="g" value="'+esc(P.rest)+'" onchange="D.plan[day].rest=this.value"></div><small>اسم اليوم · الراحة بعده</small></div><small>الاسم · Warm-up · Working</small>';
 P.ex.forEach(function(x,i){h+='<div class="card"><div class="r"><input class="g" value="'+esc(x[0])+'" onchange="D.plan[day].ex['+i+'][0]=this.value"></div><div class="r"><input type="number" min="0" value="'+x[1]+'" onchange="D.plan[day].ex['+i+'][1]=+this.value"><input type="number" min="1" max="2" value="'+x[2]+'" onchange="D.plan[day].ex['+i+'][2]=+this.value"><span class="g"></span><button onclick="mv('+i+',-1)">▲</button><button onclick="mv('+i+',1)">▼</button><button onclick="if(confirm(\'تحذف التمرين؟\')){D.plan[day].ex.splice('+i+',1);draw()}">✕</button></div></div>'});
 v.innerHTML=h+'<button class="p" onclick="D.plan[day].ex.push([\'تمرين جديد\',1,1,\'n\'+Date.now()]);draw()">+ تمرين جديد</button>'}
function mv(i,d){var a=D.plan[day].ex,j=i+d;if(j<0||j>=a.length)return;var t=a[i];a[i]=a[j];a[j]=t;draw()}
function im(v){var M=cc?(D.democ[cc]=D.democ[cc]||{}):D.demo,h='<div class="r"><select class="g" onchange="cc=this.value;draw()"><option value="">الصور الأساسية (كل الشخصيات)</option>'+Object.keys(D.chars).map(function(k){return'<option value="'+k+'"'+(k==cc?" selected":"")+'>'+esc(D.chars[k].n)+'</option>'}).join("")+'</select></div><div class="card"><div class="r"><select class="g" id="en">'+names().map(function(n){return'<option>'+esc(n)+'</option>'}).join("")+'</select></div><div class="r"><label class="g">صورة النزول <input type="file" id="f1" accept="image/png"></label></div><div class="r"><label class="g">صورة الطلوع <input type="file" id="f2" accept="image/png"></label></div><div class="r">حجم الصورة التانية % <input type="number" id="sc" value="100"> الارتفاع على الشاشة <input type="number" id="ht" value="150"></div><div class="r"><button class="p" onclick="addIm()">معالجة وإضافة</button></div><div class="r"><img id="pvi" class="t" style="height:120px"></div><small>الصور PNG بخلفية شفافة. بتتقص وتتظبط على نفس الأرض والمنتصف تلقائي.</small></div>';
 Object.keys(M).forEach(function(k){h+='<div class="card r"><b class="g">'+esc(k)+'</b><small>'+(M[k][1]?"صورتين":"صورة")+'</small><button onclick="delete (cc?D.democ[cc]:D.demo)[\''+k.replace(/'/g,"")+'\'];draw()">✕</button></div>'});v.innerHTML=h}
function addIm(){var a=$("f1").files[0],b=$("f2").files[0],n=$("en").value,s=(+$("sc").value||100)/100,t=Date.now()%1e7;if(!a||!b){toast("اختار الصورتين");return}
 Promise.all([ld(a),ld(b)]).then(function(r){var o=pair(trim(r[0],1),trim(r[1],s)),b0=(cc||"def")+"-"+slug(n)+"-"+t,M=cc?(D.democ[cc]=D.democ[cc]||{}):D.demo,w=o[0].width;stage(b0+"-down.png",o[0]);stage(b0+"-up.png",o[1]);
  M[n.toLowerCase()]=[b0+"-down.png",b0+"-up.png",Math.round($("ht").value*w/480)+"px",w+"/480"];var u=[o[0].toDataURL(),o[1].toDataURL()],i=0;toast("اتضافت (لسه محتاجة حفظ)");draw();var im=$("pvi");im.src=u[0];pv=setInterval(function(){i^=1;im.src=u[i]},800)}).catch(function(){toast("الصورة مش مقروءة")})}
function chr(v){var h='<div class="card"><div class="r"><input class="g" id="cn" placeholder="اسم الشخصية"><input type="file" id="cf" accept="image/png"></div><button class="p" onclick="addCh()">+ شخصية جديدة</button></div>';
 Object.keys(D.chars).forEach(function(k){h+='<div class="card r"><img class="t" src="../'+esc(D.chars[k].img)+'"><b class="g">'+esc(D.chars[k].n)+'</b><button onclick="if(confirm(\'تحذف الشخصية؟\')){delete D.chars[\''+k+'\'];draw()}">✕</button></div>'});v.innerHTML=h}
function addCh(){var n=$("cn").value.trim(),f=$("cf").files[0];if(!n||!f){toast("اكتب الاسم واختار الصورة");return}ld(f).then(function(i){var s=Math.min(1,700/i.height),c=cv(Math.round(i.width*s),Math.round(i.height*s));c.getContext("2d").drawImage(i,0,0,c.width,c.height);var id=slug(n)+Date.now()%1e5,p="char-"+id+".png";stage(p,c);D.chars[id]={n:n,img:p};draw()})}
$("sv").onclick=function(){if(!D){toast("اتصل الأول");return}var ps=Object.keys(F),b=$("sv");b.disabled=true;
 (function nx(i){if(i<ps.length){toast("رفع صور "+(i+1)+"/"+ps.length);return putF(ps[i],F[ps[i]],"admin: add image").then(function(){return nx(i+1)})}
  toast("حفظ البيانات...");return putF("data.json",enc(JSON.stringify(D,null,1)),"admin: update data").then(function(){return getF("sw.js")}).then(function(f){var t=f.text.replace(/workout-v(\d+)/,function(m,n){return"workout-v"+(+n+1)});if(ps.length)t=t.replace(/(F=\[[^\]]*)\]/,function(m,a){return a+","+ps.map(function(p){return'"'+p+'"'}).join(",")+"]"});return putF("sw.js",enc(t),"admin: bump cache")})})(0)
 .then(function(){F={};toast("اتحفظ ✓ التحديث بيظهر في التطبيق بعد دقيقة تقريباً")}).catch(function(e){toast(e.message)}).then(function(){b.disabled=false})};
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(function(){});
boot();
</script></body></html>
