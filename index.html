<!DOCTYPE html>
<html lang="en"><head>

<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Workout Log</title>

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<style>
:root{--bg:#f3f4f6;--card:#fff;--ink:#111827;--mut:#6b7280;--line:#e5e7eb;--cy:#00c8d8;--red:#e11d2e;--inp:#f9fafb;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b0f17;--card:#161c28;--ink:#f3f4f6;--mut:#9ca3af;--line:#262e3d;--inp:#0f141d}}
:root[data-theme="dark"]{--bg:#0b0f17;--card:#161c28;--ink:#f3f4f6;--mut:#9ca3af;--line:#262e3d;--inp:#0f141d}
*{box-sizing:inherit}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.4 -apple-system,"Segoe UI",Roboto,Arial,sans-serif;min-height:100vh}
.top{background:#111827;color:#fff;padding:8px 16px 12px;display:flex;flex-wrap:wrap;align-items:center;gap:4px 12px;position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.top img{width:42px;height:42px;border-radius:12px;background:#fff}
.top h1{font-size:19px;margin:0;flex:1}.top small{color:#9ca3af;display:block;font-weight:400;font-size:12px}
.back{background:none;border:0;color:var(--cy);font-size:15px;font-weight:700;padding:6px}
main{max-width:640px;margin:0 auto;padding:14px 14px 80px}
.btn{width:100%;border:0;border-radius:14px;padding:14px;font-size:16px;font-weight:700;background:var(--cy);color:#06222a}
.week{display:flex;align-items:center;justify-content:space-between;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin-top:10px;cursor:pointer}
.week b{font-size:18px}.week span{color:var(--mut);font-size:13px;display:block}
.dots{display:flex;gap:6px}.dot{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);font-size:12px;font-weight:700;display:grid;place-items:center;color:var(--mut)}
.dot.on{background:var(--cy);border-color:var(--cy);color:#06222a}
.tabs{display:flex;gap:8px;margin:4px 0 12px}
.tab{flex:1;padding:11px 4px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-weight:700;font-size:14px}
.tab.sel{background:#111827;color:#fff;border-color:#111827}
.datebar{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin-bottom:10px}
.datebar label{font-weight:700;font-size:14px}.datebar input{flex:1;min-width:0}
input{font:inherit;color:var(--ink);background:var(--inp);border:1px solid var(--line);border-radius:10px;padding:10px;width:100%}
.ex{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;margin-bottom:10px}
.ex h3{margin:0 0 6px;font-size:16px}.ex h3 i{color:var(--mut);font-style:normal;font-weight:400;margin-right:6px}
.chips{display:flex;gap:6px;margin-bottom:8px;flex-wrap:wrap}.chip{font-size:12px;font-weight:700;padding:3px 9px;border-radius:99px;background:var(--line);color:var(--ink)}
.chip.r{background:var(--red);color:#fff}
.g{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}.g label{font-size:11px;color:var(--mut);font-weight:700;display:block;margin-bottom:2px}
.n{margin-top:8px}
.rest{background:#111827;color:#fff;border-radius:12px;padding:10px 14px;display:flex;justify-content:space-between;font-weight:700;font-size:13px}.rest b{color:var(--cy)}
.del{background:none;border:0;color:var(--red);font-weight:700;margin-top:18px;width:100%;padding:10px}
.sv{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));background:#111827;color:#fff;border-radius:99px;padding:6px 14px;font-size:12px;opacity:0;transition:.3s}
.sv.show{opacity:.95}
.ins{background:var(--card);border-bottom:1px solid var(--line);padding:10px 14px;display:flex;align-items:center;gap:10px;font-size:14px}.ins span{flex:1}.ins button{border:0;border-radius:10px;padding:9px 14px;font-weight:700;font-size:14px;background:var(--cy);color:#06222a}.ins .x{background:none;color:var(--mut);padding:6px 8px}
.hero{display:flex;align-items:flex-end;gap:14px;border-bottom:3px solid var(--cy);margin:0 0 14px;padding:0 4px}.hero img{height:150px;width:auto;display:block;margin-bottom:-1px}.hero div{padding-bottom:12px}.hero em{font-style:normal;background:var(--cy);color:#06222a;font-weight:800;font-size:11px;border-radius:99px;padding:2px 9px}.hero h2{margin:6px 0 0;font-size:26px;line-height:1.1}.hero p{margin:4px 0 0;color:var(--mut);font-size:13px}
.by{flex-basis:100%;font-size:12px;color:#9ca3af;letter-spacing:.3px}
.ins[hidden],.ov[hidden]{display:none}
.toprow{display:flex;gap:10px;align-items:center}.toprow .btn{width:auto;flex:1;padding:20px 14px}
.charbtn{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:8px 6px;display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--ink);width:96px}
.charbtn img{height:78px;width:auto;max-width:100%;object-fit:contain}.charbtn span{font-size:10.5px;font-weight:700;line-height:1.15;text-align:center;color:var(--mut)}
.ov{position:fixed;left:0;right:0;top:0;bottom:0;background:rgba(0,0,0,.55);z-index:20;display:flex;align-items:center;justify-content:center;padding:16px}
.menu{background:var(--card);border-radius:18px;padding:14px;max-width:420px;width:100%}.menu h4{margin:0 0 10px;text-align:center;font-size:15px}
.opts{display:flex;gap:8px}.opt{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:6px;background:var(--inp);border:2px solid var(--line);border-radius:14px;padding:8px 4px;color:var(--ink)}
.opt b{font-size:13px}.opt img{height:110px;max-width:100%;object-fit:contain}.opt.on{border-color:var(--cy)}
.gear{background:none;border:0;color:#fff;padding:6px;display:flex;align-items:center}.sec{font-size:12px;font-weight:700;color:var(--mut);margin:2px 2px 6px}.hint{margin:10px 2px 0;font-size:12px;color:var(--mut)}
.eh{display:flex;gap:8px;align-items:flex-start;justify-content:space-between}.et{flex:1;min-width:0}
.demo{position:relative;width:var(--w,96px);aspect-ratio:var(--r,3/4);flex:none;margin:-4px 0 4px}.demo img{position:absolute;left:0;top:0;width:100%;height:100%;object-fit:contain;pointer-events:none}
.demo .d1{animation:dm1 2.4s steps(1,end) infinite}.demo .d2{animation:dm2 2.4s steps(1,end) infinite}
@keyframes dm1{0%{opacity:1}50%{opacity:0}100%{opacity:1}}@keyframes dm2{0%{opacity:0}50%{opacity:1}100%{opacity:0}}
@media (prefers-reduced-motion:reduce){.demo .d1{animation:none}.demo .d2{display:none}}
.g.two{grid-template-columns:1fr 1fr}
@keyframes ovin{from{opacity:0}to{opacity:1}}@keyframes ovout{from{opacity:1}to{opacity:0}}
@keyframes mnin{from{opacity:0;transform:translateY(14px) scale(.96)}to{opacity:1;transform:none}}
@keyframes mnout{from{opacity:1;transform:none}to{opacity:0;transform:translateY(10px) scale(.97)}}
@keyframes dn{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
.ov{animation:ovin .22s ease}.menu{animation:mnin .28s cubic-bezier(.2,.8,.2,1)}
.ov.out{animation:ovout .18s ease forwards;pointer-events:none}.ov.out .menu{animation:mnout .18s ease forwards}
#nw>*{animation:dn .28s cubic-bezier(.2,.8,.2,1)}.ins:not([hidden]){animation:dn .3s ease}
@media (prefers-reduced-motion:reduce){.ov,.menu,.ov.out,.ov.out .menu,#nw>*,.ins,#app.in-f,#app.in-b{animation:none!important}}
@keyframes inf{from{opacity:0;transform:translateX(28px)}to{opacity:1;transform:none}}
@keyframes inb{from{opacity:0;transform:translateX(-20px)}to{opacity:1;transform:none}}
#app.in-f{animation:inf .26s cubic-bezier(.2,.8,.2,1)}#app.in-b{animation:inb .24s cubic-bezier(.2,.8,.2,1)}
.empty{text-align:center;color:var(--mut);margin:30px 0}
</style></head><body>
<div class="top"><div class="by">by: Omar Sherif</div><img src="icon-192.png" alt=""><h1 id="t">Workout Log<small id="sub">Full body split</small></h1><button class="back" id="back" hidden>&#8249; Weeks</button><button class="gear" id="gear" aria-label="Settings"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></button></div>

<script>
var PLAN={
A:{n:"Full Body A",rest:"1 rest day",ex:[["DB lateral raises",2,2],["DB Flat Chest Press",3,1],["T-Bar Row",2,1],["Cable Rear Delt fly",1,1],["WG lat pulldown",1,1],["SA Triceps Pushdown",1,1],["Face Away curl",1,1],["Leg Press",3,1],["Seated leg curl",1,1],["Shoulder Press",1,1]]},
B:{n:"Full Body B",rest:"2 rest days",ex:[["SA Cable lateral raises",2,1],["T-Bar Row",2,1],["Cable Rear Delt fly",1,1],["Inclined chest press machine",2,1],["NG Lat row",1,1],["Overhead Triceps extension",2,2],["Face away curl",2,1],["Wide chest press machine",2,1],["WG lat pulldown",2,1],["Leg Extension",2,1],["Seated leg curl",1,2],["Leg press calf raises",2,2],["Smith shrugs",1,1]]},
C:{n:"Full Body C",rest:"1 rest day",ex:[["SA Cable lateral raises",2,1],["DB Flat Chest Press",3,1],["T-Bar Row",2,1],["DB biceps curl",1,2],["NG Lat row",1,1],["SA Triceps Pushdown",1,1],["Leg press calf raises",1,1],["Leg extension",2,1],["Seated leg curl",2,1],["reverse curl",0,1],["wrist curl",0,1]]}};
var OFF={A:0,B:2,C:5},KEYS=["A","B","C"],LS="wl_state_v1";
var S={weeks:[],t:0},view=null,tab="A",dbDoc=null,timer=null;
var app=document.getElementById("app");
function $(i){return document.getElementById(i)}
function pad(n){return(n<10?"0":"")+n}
function iso(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())}
function addDays(s,n){var p=s.split("-"),d=new Date(+p[0],+p[1]-1,+p[2]+n);return iso(d)}
function fmt(s){if(!s)return"";var p=s.split("-");return(+p[2])+"/"+(+p[1])}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function flash(m){var e=$("sv");e.textContent=m;e.className="sv show";clearTimeout(flash.t);flash.t=setTimeout(function(){e.className="sv"},1200)}
function load(){try{var r=localStorage.getItem(LS);if(r){var o=JSON.parse(r);if(o&&o.weeks)S=o}}catch(e){}}
function save(){S.t=Date.now();try{localStorage.setItem(LS,JSON.stringify(S));flash("Saved")}catch(e){flash("Could not save")}}
function wk(id){for(var i=0;i<S.weeks.length;i++)if(S.weeks[i].id===id)return S.weeks[i]}
function sorted(){return S.weeks.slice().sort(function(a,b){return a.start<b.start?1:-1})}
function filled(w,k){var d=w.days[k];if(!d)return false;for(var i in d.ex){var e=d.ex[i];if(e&&(e.a||e.w||e.b))return true}return false}
var DEMO={"db lateral raises":["lat-down.png","lat-up.png","96px","3/4"],"db flat chest press":["chest-down.png","chest-up.png","140px","420/327"],"db biceps curl":["biceps-down.png","biceps-up.png","118px","360/451"],"t-bar row":["tbar-down.png","tbar-up.png","124px","360/373"],
"ng lat row":["nglat-relaxed.png","nglat-pulled.png","140px","420/403"],"sa triceps pushdown":["tri-relaxed.png","tri-extended.png","88px","243/420"],"face away curl":["curl-relaxed.png","curl-bended.png","100px","279/420"],"shoulder press":["shpress-down.png","shpress-up.png","104px","292/420"],"wg lat pulldown":["wg-up.png","wg-down.png","101px","282/420"],
"cable rear delt fly":["fly-relaxed.png","fly-pulled.png","120px","359/420"],"leg extension":["legext-down.png","legext-up.png","122px","368/420"],"seated leg curl":["legcurl-up.png","legcurl-down.png","121px","363/420"],"sa cable lateral raises":["salat-relaxed.png","salat-raised.png","122px","362/420"],"reverse curl":["revcurl-down.png","revcurl-up.png","112px","286/420"]};
var CH={omar:{n:"Omar",img:"figure.png"},ziad:{n:"Ziad",img:"ziad.png"},dardiry:{n:"Dardiry",img:"dardiry.png"},jamal:{n:"Jamal",img:"jamal.png"}},CK=["omar","ziad","dardiry","jamal"];
function charId(){try{var c=localStorage.getItem("wl_char");if(c&&CH[c])return c}catch(e){}return"omar"}
var ovPushed=false,ignorePop=false;
function showOv(){var ov=$("ov");if(!ovPushed){try{history.pushState({ov:1},"")}catch(e){}ovPushed=true}ov.classList.remove("out");ov.hidden=false}
function closeOv(fromPop){var ov=$("ov");if(ov.hidden||ov.classList.contains("out"))return;ov.classList.add("out");setTimeout(function(){ov.hidden=true;ov.classList.remove("out")},180);if(!fromPop&&ovPushed){ovPushed=false;ignorePop=true;try{history.back()}catch(e){ignorePop=false}}}
function goHome(){if(history.state&&history.state.v==="week"){try{history.back();return}catch(e){}}home()}
function menu(){var cur=charId(),ov=$("ov");
 $("mn").innerHTML='<h4>Choose your character</h4><div class="opts">'+CK.map(function(k){return'<button class="opt'+(k===cur?" on":"")+'" data-c="'+k+'"><b>'+CH[k].n+'</b><img src="'+CH[k].img+'" alt=""></button>'}).join("")+'</div>';
 showOv();ov.onclick=function(e){if(e.target===ov)closeOv()};
 Array.prototype.forEach.call($("mn").querySelectorAll(".opt"),function(b){b.onclick=function(){try{localStorage.setItem("wl_char",b.getAttribute("data-c"))}catch(e){}closeOv();home()}})}
function theme(){try{var t=localStorage.getItem("wl_theme");if(t==="light"||t==="dark")return t}catch(e){}return"auto"}
function applyTheme(){var t=theme(),r=document.documentElement;if(t==="auto")r.removeAttribute("data-theme");else r.setAttribute("data-theme",t)}
function settings(){var cur=theme(),ov=$("ov");
 $("mn").innerHTML='<h4>Settings</h4><div class="sec">THEME</div><div class="opts">'+[["light","Light"],["dark","Dark"],["auto","Auto"]].map(function(o){return'<button class="opt'+(o[0]===cur?" on":"")+'" data-t="'+o[0]+'"><b>'+o[1]+'</b></button>'}).join("")+'</div><p class="hint">Auto follows your device settings.</p>';
 showOv();ov.onclick=function(e){if(e.target===ov)closeOv()};
 Array.prototype.forEach.call($("mn").querySelectorAll(".opt"),function(b){b.onclick=function(){try{localStorage.setItem("wl_theme",b.getAttribute("data-t"))}catch(e){}applyTheme();settings()}})}
function anim(c){var a=$("app");a.classList.remove("in-f","in-b");void a.offsetWidth;a.classList.add(c);setTimeout(function(){a.classList.remove(c)},300)}
function home(){var w=view!==null;homeR();if(w)anim("in-b")}
function homeR(){view=null;$("back").hidden=true;$("sub").textContent="Full body split";
 var h='<div class="toprow"><button class="charbtn" id="chb"><img src="'+CH[charId()].img+'" alt=""><span>Choose your character</span></button><button class="btn" id="new">+ New week</button></div><div id="nw"></div>';var ws=sorted();
 if(!ws.length)h+='<p class="empty">No weeks yet. Tap "New week" and pick the date you start Full Body A.</p>';
 ws.forEach(function(w){h+='<div class="week" data-id="'+w.id+'"><div><b>Week of '+fmt(w.start)+'</b><span>'+KEYS.map(function(k){return fmt(w.days[k].date)}).join(" · ")+'</span></div><div class="dots">'+KEYS.map(function(k){return'<div class="dot'+(filled(w,k)?" on":"")+'">'+k+'</div>'}).join("")+'</div></div>'});
 h+='<div style="display:flex;gap:8px;margin-top:22px"><button class="tab" id="exp">Export backup</button><button class="tab" id="imp">Import backup</button></div><input type="file" id="imf" accept=".json,application/json" hidden>';
 app.innerHTML=h;
 $("exp").onclick=function(){var b=new Blob([JSON.stringify(S)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="workout-backup-"+iso(new Date())+".json";document.body.appendChild(a);a.click();a.remove()};
 $("imp").onclick=function(){$("imf").click()};
 $("imf").onchange=function(){var f=this.files[0];if(!f)return;var r=new FileReader();r.onload=function(){try{var o=JSON.parse(r.result);if(o&&o.weeks){S=o;migrate();save();home()}else flash("Invalid file")}catch(e){flash("Invalid file")}};r.readAsText(f)};
 $("chb").onclick=menu;
 $("new").onclick=function(){$("nw").innerHTML='<div class="datebar" style="margin-top:10px"><label>Start of Full Body A</label><input type="date" id="nd" value="'+iso(new Date())+'"></div><button class="btn" id="mk">Create week</button>';
  $("mk").onclick=function(){var d=$("nd").value;if(!d)return;var w={id:"w"+Date.now(),start:d,days:{}};KEYS.forEach(function(k){w.days[k]={date:addDays(d,OFF[k]),ex:{}}});S.weeks.push(w);save();open(w.id)}};
 Array.prototype.forEach.call(app.querySelectorAll(".week"),function(e){e.onclick=function(){open(e.getAttribute("data-id"))}})}
function prev(w,k,i){var best=null;S.weeks.forEach(function(o){if(o.id!==w.id&&o.start<w.start&&o.days[k]&&o.days[k].ex[i]&&o.days[k].ex[i].w&&(!best||o.start>best.start))best=o});return best?best.days[k].ex[i].w:""}
function open(id,nopush){var fh=view===null;if(!nopush){try{history.pushState({v:"week",id:id},"")}catch(e){}}view=id;$("back").hidden=false;var w=wk(id);$("sub").textContent="Week of "+fmt(w.start);draw();if(fh)anim("in-f")}
function draw(){var w=wk(view),d=w.days[tab],P=PLAN[tab];
 var n=KEYS.filter(function(k){return filled(w,k)}).length;var h='<div class="hero"><img src="'+CH[charId()].img+'" alt=""><div><em>WEEK</em><h2>'+fmt(w.start)+'</h2><p>'+n+' of 3 days logged</p></div></div><div class="tabs">'+KEYS.map(function(k){return'<button class="tab'+(k===tab?" sel":"")+'" data-k="'+k+'">'+PLAN[k].n.replace("Full Body ","Day ")+'<br><small>'+fmt(w.days[k].date)+'</small></button>'}).join("")+'</div>';
 h+='<div class="datebar"><label>'+P.n+' date</label><input type="date" id="dt" value="'+d.date+'"></div>';
 P.ex.forEach(function(x,i){var e=d.ex[i]||{},pw=prev(w,tab,i);
  var dm=DEMO[x[0].toLowerCase()];h+='<div class="ex"><div class="eh"><div class="et"><h3><i>'+(i+1)+'</i>'+esc(x[0])+'</h3><div class="chips"><span class="chip">Warm-up '+x[1]+'</span><span class="chip r">Working '+x[2]+'</span></div></div>'+(dm?'<div class="demo" style="--w:'+dm[2]+';--r:'+dm[3]+'"><img class="d1" src="'+dm[0]+'" alt=""><img class="d2" src="'+dm[1]+'" alt=""></div>':'')+'</div><div class="g'+(x[2]>1?'':' two')+'">'
  +'<div><label>First set</label><input data-i="'+i+'" data-f="a" inputmode="decimal" value="'+esc(e.a)+'"></div>'
  +'<div><label>Weight (kg)</label><input data-i="'+i+'" data-f="w" inputmode="decimal" placeholder="'+(pw?"last "+esc(pw):"")+'" value="'+esc(e.w)+'"></div>'
  +(x[2]>1?'<div><label>Second set</label><input data-i="'+i+'" data-f="b" inputmode="decimal" value="'+esc(e.b)+'"></div>':'')+'</div>'
  +'<div class="n"><input data-i="'+i+'" data-f="n" placeholder="Notes" value="'+esc(e.n)+'"></div></div>'});
 h+='<div class="rest"><span>THEN: '+P.rest.toUpperCase()+'</span><b>REST &amp; RECOVER</b></div><button class="del" id="del">Delete this week</button>';
 app.innerHTML=h;window.scrollTo(0,0);
